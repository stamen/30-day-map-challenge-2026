  <div class="wide">
    <figure>
      <a href="funkiest-interstate.png">
        <img src="funkiest-interstate-2000.webp" width="2000" height="1000"
             alt="Three retro neon posters of Interstate 380 on a purple background. California: 3.3 miles from I-280 to US-101, past San Bruno and SFO. Iowa: 73 miles from Waterloo through Cedar Rapids to Iowa City. Pennsylvania: 28 miles from the Poconos to Scranton.">
      </a>
      <figcaption>
        <p class="lede">Here’s my 10 minute map of I-380, the funkiest interstate in America, which I drive at least once a week. My best time from home to Costco is seven minutes, mostly spent covering its entire length: all three miles of it. I only recently learned there are two other I-380s, so I made a triptych.</p>
