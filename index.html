<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stamen #30DayMapChallenge</title>
  <meta name="description" content="Maps made by the Stamen team for the 2026 #30DayMapChallenge.">
  <style>
    :root {
      --bg: #fff;
      --fg: #000;
      --hl: #ffff00;
      --hl-fg: #000;
      --box: #000;
      --box-fg: #fff;
      --muted: #555;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --fg: #fff;
        --box: #fff;
        --box-fg: #000;
        --muted: #aaa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 18px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 44rem;
      margin: 0 auto;
      padding: 4rem 1rem 3rem;
    }
    h1 {
      font-size: min(4rem, calc((min(100vw, 44rem) - 2rem) / 11.5));
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.02em;
      margin: 0 0 1.5rem;
      overflow-wrap: anywhere;
    }
    .hl {
      background: var(--hl);
      color: var(--hl-fg);
      padding: 0 0.12em;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    .lede { font-size: 1.15rem; margin: 0 0 3rem; max-width: 34rem; }
    a { color: inherit; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    a:hover, a:focus-visible { background: var(--hl); color: var(--hl-fg); }
    h2 {
      display: inline-block;
      background: var(--box);
      color: var(--box-fg);
      font-size: 1rem;
      font-weight: 700;
      padding: 0.35rem 0.7rem;
      margin: 0;
    }
    ul { list-style: none; margin: 0; padding: 0; border-top: 4px solid var(--fg); }
    li { border-bottom: 2px solid var(--fg); }
    li a {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 0 1rem;
      padding: 1rem 0.5rem;
      text-decoration: none;
    }
    ul.maps li a { grid-template-columns: 4.25rem 1fr auto; }
    .day {
      justify-self: start;
      background: var(--box);
      color: var(--box-fg);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.2rem 0.5rem;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    li a:hover .day, li a:focus-visible .day { background: var(--hl-fg); color: var(--hl); }
    .name { display: block; font-weight: 700; font-size: 1.35rem; line-height: 1.2; }
    .meta { display: block; font-size: 1rem; }
    .arrow { font-weight: 700; font-size: 1.35rem; }
    footer { margin-top: 3rem; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1><span class="hl">Stamen</span><br><span class="hl">#30DayMapChallenge</span></h1>
    <p class="lede">Maps made by the <a href="https://stamen.com/">Stamen</a> team for the 2026 <a href="https://30daymapchallenge.com/">#30DayMapChallenge</a>.</p>

    <section>
      <h2>2026 maps</h2>
      <ul id="maps" class="maps"></ul>
      <noscript><p>This list needs JavaScript to display.</p></noscript>
    </section>

    <footer>
      <a href="https://github.com/stamen">github.com/stamen</a>
    </footer>
  </main>

  <script>
    // ── Add new maps here ──────────────────────────────────────────────
    // One line per map, in any order: the list sorts itself by day.
    // Several maps can share the same day.
    // A page inside this repo can use a relative url, like "funkiest-interstate/".
    const MAPS = [
      { day: 1, title: "Time Zone Inversions",  author: "Alan McConchie", url: "https://mappingmashups.github.io/time-zone-inversions/" },
      { day: 2, title: "Interrupted Contours",  author: "Alan McConchie", url: "https://mappingmashups.github.io/contourvolution/" },
      { day: 3, title: "Voronoi Highways",      author: "Alan McConchie", url: "https://mappingmashups.github.io/voronoi-highways/" },
      { day: 4, title: "Candy Clusters",        author: "Kelsey Taylor",  url: "https://stamen.github.io/candy-clusters/" },
      { day: 5, title: "Viewshed Viewer",       author: "Alex Parlato",   url: "https://stamen.github.io/30-day-map-viewshed/" },
      { day: 6, title: "Vin-t-age",             author: "Kelsey Taylor",  url: "https://stamen.github.io/30-day-map-vintage/" },
      { day: 7, title: "The Funkiest Interstate in America", author: "Vinay Dixit", url: "funkiest-interstate/" },
      { day: 8, title: "In Perpetuity",         author: "Kelsey Taylor",  url: "https://stamen.github.io/30-day-map-in-perpetuity/" },
      { day: 9, title: "Where would High Speed Rail work in North America?", author: "Alan McConchie", url: "https://mappingmashups.github.io/hsr-density-maps/" },
      { day: 10, title: "Prompted Population Maps", author: "Alan McConchie", url: "https://stamen.github.io/prompted-population-maps/" },
    ];
    // ───────────────────────────────────────────────────────────────────

    // The 2026 challenge prompts, by day. Each map shows its day's prompt.
    // To override it for one map, add `theme: "…"` to that map's line.
    const THEMES = {
      1: "Points",
      2: "Lines",
      3: "Polygons",
      4: "Clusters",
      5: "Senses: Sight",
      6: "Vintage",
      7: "10 minute map",
      8: "Utopia",
      9: "Urban-rural",
      10: "Prompting only",
      11: "Senses: Sound",
      12: "Power",
      13: "Interactions",
      14: "Borgesian map",
      15: "Inside out",
      16: "Collaborative map",
      17: "Light & dark",
      18: "NULL",
      19: "Senses: Smell",
      20: "Hexagons",
      21: "OpenStreetMap",
      22: "Projections",
      23: "Senses: Taste",
      24: "Network",
      25: "Is this a map?",
      26: "Water",
      27: "New tool",
      28: "Senses: Feeling",
      29: "Raster",
      30: "Pen & paper",
    };

    const list = document.getElementById("maps");
    MAPS
      .map((m, i) => ({ ...m, i }))
      .sort((a, b) => a.day - b.day || a.i - b.i)
      .forEach((m) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = m.url;

        const day = document.createElement("span");
        day.className = "day";
        day.textContent = "Day " + m.day;

        const text = document.createElement("span");
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = m.title;
        const meta = document.createElement("span");
        meta.className = "meta";
        const theme = m.theme || THEMES[m.day];
        meta.textContent = theme ? theme + " · " + m.author : m.author;
        text.append(name, meta);

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.setAttribute("aria-hidden", "true");
        arrow.textContent = "→";

        a.append(day, text, arrow);
        li.append(a);
        list.append(li);
      });
  </script>
</body>
</html>
